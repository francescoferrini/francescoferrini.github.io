<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Inter, system-ui, sans-serif" font-size="14">
  <style>
    .box{fill:#fff;stroke:#1f2937;stroke-width:1.5}
    .obs{fill:#dbeafe;stroke:#1d4ed8}
    .miss{fill:#fee2e2;stroke:#b91c1c}
    .mask1{fill:#fde68a;stroke:#b45309}
    .mask0{fill:#e5e7eb;stroke:#374151}
    .gnn{fill:#ddd6fe;stroke:#6d28d9}
    .pred{fill:#dcfce7;stroke:#15803d}
    .lab{font-weight:600;fill:#111827}
    .small{font-size:12px;fill:#374151}
    .arrow{fill:none;stroke:#374151;stroke-width:1.6;marker-end:url(#ah)}
    .title{font-weight:700;font-size:13px;fill:#111827}
    .cap{font-size:12px;fill:#6b7280;font-style:italic}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <!-- 1. Observed features matrix with missing entries -->
  <text x="20" y="30" class="title">1. Observed features X<tspan font-size="10" dy="3">obs</tspan></text>
  <g transform="translate(20,45)">
    <rect class="obs" x="0"   y="0"  width="40" height="22"/><text x="20" y="15" text-anchor="middle">2.1</text>
    <rect class="miss" x="40"  y="0"  width="40" height="22"/><text x="60" y="15" text-anchor="middle">?</text>
    <rect class="obs" x="80"  y="0"  width="40" height="22"/><text x="100" y="15" text-anchor="middle">0.7</text>

    <rect class="obs" x="0"   y="22" width="40" height="22"/><text x="20" y="37" text-anchor="middle">1.4</text>
    <rect class="obs" x="40"  y="22" width="40" height="22"/><text x="60" y="37" text-anchor="middle">3.2</text>
    <rect class="miss" x="80"  y="22" width="40" height="22"/><text x="100" y="37" text-anchor="middle">?</text>

    <rect class="miss" x="0"   y="44" width="40" height="22"/><text x="20" y="59" text-anchor="middle">?</text>
    <rect class="obs" x="40"  y="44" width="40" height="22"/><text x="60" y="59" text-anchor="middle">0.9</text>
    <rect class="obs" x="80"  y="44" width="40" height="22"/><text x="100" y="59" text-anchor="middle">1.1</text>
  </g>
  <text x="20" y="135" class="cap">red = missing</text>

  <!-- arrow down split -->
  <path class="arrow" d="M 80,150 V 175"/>

  <!-- 2a. zero-fill -->
  <text x="20" y="200" class="title">2a. zero-fill(X<tspan font-size="10" dy="3">obs</tspan>)</text>
  <g transform="translate(20,215)">
    <rect class="obs" x="0"   y="0"  width="40" height="22"/><text x="20" y="15" text-anchor="middle">2.1</text>
    <rect class="box" x="40"  y="0"  width="40" height="22"/><text x="60" y="15" text-anchor="middle" fill="#9ca3af">0</text>
    <rect class="obs" x="80"  y="0"  width="40" height="22"/><text x="100" y="15" text-anchor="middle">0.7</text>

    <rect class="obs" x="0"   y="22" width="40" height="22"/><text x="20" y="37" text-anchor="middle">1.4</text>
    <rect class="obs" x="40"  y="22" width="40" height="22"/><text x="60" y="37" text-anchor="middle">3.2</text>
    <rect class="box" x="80"  y="22" width="40" height="22"/><text x="100" y="37" text-anchor="middle" fill="#9ca3af">0</text>

    <rect class="box" x="0"   y="44" width="40" height="22"/><text x="20" y="59" text-anchor="middle" fill="#9ca3af">0</text>
    <rect class="obs" x="40"  y="44" width="40" height="22"/><text x="60" y="59" text-anchor="middle">0.9</text>
    <rect class="obs" x="80"  y="44" width="40" height="22"/><text x="100" y="59" text-anchor="middle">1.1</text>
  </g>

  <!-- 2b. mask M -->
  <text x="180" y="200" class="title">2b. Missingness mask M</text>
  <g transform="translate(180,215)">
    <rect class="mask0" x="0"   y="0"  width="40" height="22"/><text x="20" y="15" text-anchor="middle">0</text>
    <rect class="mask1" x="40"  y="0"  width="40" height="22"/><text x="60" y="15" text-anchor="middle">1</text>
    <rect class="mask0" x="80"  y="0"  width="40" height="22"/><text x="100" y="15" text-anchor="middle">0</text>

    <rect class="mask0" x="0"   y="22" width="40" height="22"/><text x="20" y="37" text-anchor="middle">0</text>
    <rect class="mask0" x="40"  y="22" width="40" height="22"/><text x="60" y="37" text-anchor="middle">0</text>
    <rect class="mask1" x="80"  y="22" width="40" height="22"/><text x="100" y="37" text-anchor="middle">1</text>

    <rect class="mask1" x="0"   y="44" width="40" height="22"/><text x="20" y="59" text-anchor="middle">1</text>
    <rect class="mask0" x="40"  y="44" width="40" height="22"/><text x="60" y="59" text-anchor="middle">0</text>
    <rect class="mask0" x="80"  y="44" width="40" height="22"/><text x="100" y="59" text-anchor="middle">0</text>
  </g>

  <!-- concat arrow -->
  <text x="320" y="250" class="small">concat</text>
  <path class="arrow" d="M 310,255 H 365"/>

  <!-- 3. Concatenated input -->
  <text x="380" y="200" class="title">3. [zero-fill || M]</text>
  <g transform="translate(380,215)">
    <!-- zero-fill block -->
    <rect class="obs" x="0"   y="0"  width="20" height="22"/>
    <rect class="box" x="20"  y="0"  width="20" height="22"/>
    <rect class="obs" x="40"  y="0"  width="20" height="22"/>
    <!-- mask block -->
    <rect class="mask0" x="62"  y="0"  width="20" height="22"/>
    <rect class="mask1" x="82"  y="0"  width="20" height="22"/>
    <rect class="mask0" x="102" y="0"  width="20" height="22"/>

    <rect class="obs" x="0"   y="22" width="20" height="22"/>
    <rect class="obs" x="20"  y="22" width="20" height="22"/>
    <rect class="box" x="40"  y="22" width="20" height="22"/>
    <rect class="mask0" x="62"  y="22" width="20" height="22"/>
    <rect class="mask0" x="82"  y="22" width="20" height="22"/>
    <rect class="mask1" x="102" y="22" width="20" height="22"/>

    <rect class="box" x="0"   y="44" width="20" height="22"/>
    <rect class="obs" x="20"  y="44" width="20" height="22"/>
    <rect class="obs" x="40"  y="44" width="20" height="22"/>
    <rect class="mask1" x="62"  y="44" width="20" height="22"/>
    <rect class="mask0" x="82"  y="44" width="20" height="22"/>
    <rect class="mask0" x="102" y="44" width="20" height="22"/>
  </g>
  <text x="380" y="305" class="cap">no learned imputation</text>
  <text x="380" y="320" class="cap">no MAR assumption</text>

  <!-- arrow to GNN -->
  <path class="arrow" d="M 510,250 H 560"/>

  <!-- 4. GNN box -->
  <rect class="gnn" x="565" y="215" width="160" height="80" rx="6"/>
  <text x="645" y="245" class="title" text-anchor="middle">Standard GNN</text>
  <text x="645" y="263" text-anchor="middle" class="small">GCN · GraphSAGE · GIN</text>
  <text x="645" y="280" text-anchor="middle" class="small">message passing</text>

  <!-- arrow to predictions -->
  <path class="arrow" d="M 727,255 H 770"/>

  <!-- 5. Predictions -->
  <rect class="pred" x="775" y="225" width="105" height="60" rx="6"/>
  <text x="828" y="252" class="title" text-anchor="middle">ŷ</text>
  <text x="828" y="272" text-anchor="middle" class="small">node labels</text>

  <!-- Top-right: original X with missing pattern circled -->
  <text x="280" y="30" class="title">GNNmim: a missing-indicator baseline</text>
  <text x="280" y="50" class="small">The mask M tells the GNN which entries are real and which are placeholders.</text>
  <text x="280" y="70" class="small">No imputation. No assumptions. Just an extra column per feature.</text>

  <!-- Legend -->
  <g transform="translate(560, 25)">
    <rect class="obs" x="0" y="0" width="14" height="14"/>
    <text x="20" y="11" class="small">observed</text>
    <rect class="miss" x="80" y="0" width="14" height="14"/>
    <text x="100" y="11" class="small">missing</text>
    <rect class="mask1" x="160" y="0" width="14" height="14"/>
    <text x="180" y="11" class="small">M = 1</text>
    <rect class="mask0" x="230" y="0" width="14" height="14"/>
    <text x="250" y="11" class="small">M = 0</text>
  </g>
</svg>
